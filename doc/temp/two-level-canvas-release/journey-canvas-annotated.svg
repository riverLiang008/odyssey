<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Journey Canvas system-level structure and workflow preview</title>
  <desc id="desc">The Odyssey Journey Canvas with numbered emphasis on system configuration, the selected Agent Slot, and the read-only workflow preview.</desc>
  <defs>
    <mask id="focus-mask">
      <rect width="1440" height="900" fill="white"/>
      <rect x="545" y="156" width="865" height="720" rx="16" fill="black"/>
    </mask>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172033" flood-opacity="0.24"/>
    </filter>
  </defs>
  <image x="0" y="0" width="1440" height="900" xlink:href="../../assets/journey-canvas.png"/>
  <rect width="1440" height="900" fill="#172033" opacity="0.12" mask="url(#focus-mask)"/>
  <rect x="548" y="159" width="859" height="714" rx="14" fill="none" stroke="#4C6FFF" stroke-width="4"/>
  <rect x="750" y="266" width="375" height="254" rx="14" fill="none" stroke="#4C6FFF" stroke-width="4"/>
  <rect x="1135" y="679" width="241" height="170" rx="13" fill="none" stroke="#4C6FFF" stroke-width="4"/>
  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="white" filter="url(#shadow)">
    <circle cx="568" cy="179" r="17" fill="#4C6FFF"/><text x="568" y="185">1</text>
    <circle cx="770" cy="286" r="17" fill="#4C6FFF"/><text x="770" y="292">2</text>
    <circle cx="1155" cy="699" r="17" fill="#4C6FFF"/><text x="1155" y="705">3</text>
  </g>
</svg>
