[project]
name = "odyssey-api"
version = "0.1.0"
description = "Odyssey product configuration API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.5,<2",
  "asyncpg>=0.30.0,<1",
  "fastapi>=0.116.1,<1",
  "pydantic-settings>=2.10.1,<3",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "pytest>=8.4.1,<9",
  "pytest-asyncio>=1.1.0,<2",
  "ruff>=0.12.10,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
markers = [
  "integration: requires the local PostgreSQL service",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odyssey_api"]

