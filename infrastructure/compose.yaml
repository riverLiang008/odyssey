name: odyssey

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: odyssey
      POSTGRES_USER: odyssey
      POSTGRES_PASSWORD: odyssey
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odyssey -d odyssey"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO stopped publishing public container images in 2026. RustFS keeps
    # the same local S3 endpoint while remaining available as a pinned image.
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:5173,http://localhost:5173
      RUSTFS_ACCESS_KEY: odyssey
      RUSTFS_SECRET_KEY: odyssey-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:

